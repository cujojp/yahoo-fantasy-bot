version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: yahoo-fantasy-bot-db
    environment:
      POSTGRES_DB: yahoo_fantasy_bot
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d yahoo_fantasy_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
