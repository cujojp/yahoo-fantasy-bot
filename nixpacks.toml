[phases.setup]
nixPkgs = ['...', 'nodejs', 'yarn']

[phases.build]
cmds = [
    'chmod +x ./gradlew',
    './gradlew :backend:clean :backend:build :backend:shadowJar --no-daemon -x test',
    'mkdir -p build/libs',
    'cp backend/build/libs/*.jar build/libs/ || true',
    'ls -la build/libs/'
]

[start]
cmd = 'java -jar build/libs/backend.jar'
